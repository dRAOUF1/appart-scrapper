name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une branche annule le run précédent : pas de file
# d'attente inutile, sauf sur main où chaque commit doit garder son verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12" # doit rester alignée sur le FROM du Dockerfile
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer ruff
        run: pip install "$(grep -E '^ruff' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # Tourne SANS Postgres, volontairement : c'est la garantie que les tests
  # unitaires ne dépendent d'aucune base. Si l'un d'eux ouvre une connexion,
  # il échoue ici — c'est le but.
  unit:
    name: Tests unitaires (sans base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest -m "not integration"
        run: |
          pytest tests/ -m "not integration" \
            --cov --cov-report=xml:coverage-unit.xml --cov-report=term-missing \
            --junitxml=junit-unit.xml

      - name: Garde-fou — aucun test ne doit voir DATABASE_URL
        # TEST_DATABASE_URL n'est pas défini dans ce job : les tests
        # d'intégration DOIVENT être sautés. Zéro skip signifierait qu'ils ont
        # trouvé une base ailleurs — exactement l'incident du 2026-07-14.
        run: |
          set -euo pipefail
          out=$(pytest tests/integration/ -q --no-header 2>&1 | tail -5)
          echo "$out"
          if grep -q 'no tests ran' <<<"$out"; then
            echo "::error::Aucun test d'intégration collecté : la suite ne couvre plus le SQL réel."
            exit 1
          fi
          if ! grep -qE '[0-9]+ skipped' <<<"$out"; then
            echo "::error::Les tests d'intégration n'ont pas été sautés sans TEST_DATABASE_URL — ils ont trouvé une base."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage-unit.xml
            junit-unit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  integration:
    name: Tests d'intégration (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Jamais DATABASE_URL : voir tests/integration/conftest.py, qui refuse
      # d'ailleurs tout host non local.
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest -m integration
        run: |
          pytest tests/ -m integration \
            --cov --cov-report=xml:coverage-integration.xml --cov-report=term-missing \
            --junitxml=junit-integration.xml

      - name: Vérifier que les tests d'intégration ont bien tourné
        # Un `skipped` ici voudrait dire que la fixture n'a pas vu la base :
        # la suite passerait au vert sans rien exercer.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse("junit-integration.xml").getroot()
          suite = r.find("testsuite") if r.tag == "testsuites" else r
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"{tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("Les tests d'intégration n'ont pas réellement tourné contre Postgres.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration-pg${{ matrix.postgres }}
          path: |
            coverage-integration.xml
            junit-integration.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  coverage:
    name: Seuil de couverture
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Suite complète + seuil
        # Le seuil vit dans .github/coverage-threshold : il ne doit que monter.
        run: |
          set -euo pipefail
          threshold=$(cat .github/coverage-threshold)
          echo "Seuil exigé : ${threshold}%"
          pytest tests/ --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${threshold}"

      - name: Résumé dans le job summary
        if: always()
        run: |
          {
            echo "### Couverture"
            echo '```'
            coverage report --format=markdown 2>/dev/null || coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    services:
      # L'app ouvre une connexion dans son `before_request`, y compris pour
      # /health : le smoke test exige donc une vraie base.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: appart-scrapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Appliquer les migrations sur la base jetable
        # Exerce scripts/migrate.py, l'étape de déploiement réelle — et vérifie
        # qu'elle tourne bien depuis l'image de production.
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb \
            --entrypoint python appart-scrapper:ci -m scripts.migrate

      - name: Smoke test — l'app démarre et /health répond
        run: |
          set -euo pipefail
          docker run -d --name smoke --network host \
            -e PORT=10000 \
            -e SECRET_KEY=ci-smoke-secret \
            -e ADMIN_USERNAME=ci-admin \
            -e DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb \
            appart-scrapper:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health >/dev/null 2>&1; then
              echo "/health répond"; ok=1; break
            fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke >/dev/null
          [ "${ok:-}" = "1" ] || { echo "::error::/health n'a jamais répondu"; exit 1; }

      - name: L'image de prod ne doit contenir ni tests ni .env
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh appart-scrapper:ci -c 'ls /app/tests /app/.env' 2>/dev/null; then
            echo "::error::L'image de production embarque tests/ ou .env"
            exit 1
          fi
          echo "Image propre : ni tests/ ni .env"

  # ---------------------------------------------------------------------------
  # Valide le chemin documenté dans le README, celui que les devs lancent
  # vraiment en local.
  compose:
    name: docker compose (suite complète)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose -f docker-compose.test.yml
        run: |
          docker compose -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from app

      - name: Nettoyage
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ---------------------------------------------------------------------------
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --desc

      - name: Aucun secret committé
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env est suivi par git"
            exit 1
          fi
          if git ls-files | grep -qE '\.sql$'; then
            echo "::error::un dump .sql est suivi par git"
            exit 1
          fi
          echo "Ni .env ni dump .sql dans l'index git"

  # ---------------------------------------------------------------------------
  # Point d'entrée unique pour la protection de branche : un seul check à
  # cocher côté GitHub, qui échoue si n'importe quel job amont échoue.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, coverage, docker, compose, audit]
    if: always()
    steps:
      - name: Verdict
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "Résultats amont : $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::Un job amont a échoué ($r)"; exit 1; }
          done
          echo "Tous les jobs sont au vert."
