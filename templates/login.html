{% extends "base.html" %}
{% block title %}Connexion — SeLoger Tracker{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <span class="login-logo">🏠</span>
            <h1>SeLoger Tracker</h1>
            <p class="login-subtitle">Suivez vos annonces immobilières en temps réel</p>
        </div>

        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre nom" required autofocus
                    autocomplete="username">
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                Se connecter / S'inscrire
            </button>
        </form>

        <p class="login-hint">
            Si le compte n'existe pas, il sera créé automatiquement.
        </p>
    </div>
</div>
{% endblock %}
