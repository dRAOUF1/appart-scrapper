services:
  - type: worker
    name: seloger-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt  # Plus proche de la France
    plan: starter
    envVars:
      - key: CHROME_BIN
        value: /usr/bin/chromium
