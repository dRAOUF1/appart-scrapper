debug: true
check_interval: 5 # Interval in minutes between checks

# Global search criteria (shared by all scrapers)
search_criteria:
  price_min: 600
  price_max: 850
  surface_min: 19

scrapers:
  seloger:
    enabled: false
    base_url: "https://www.seloger.com/classified-search" 
    filters:
      locations: "AD08FR31096"

  bienici:
    enabled: false
    filters:
      zone_ids: ["-7444"]  # Paris zone
      property_types: ["flat"]

  laforet:
    enabled: false
    filters:
      cities: ["75056"]  # Paris
      allowed_zipcodes: ["75"]  # Only keep listings with zipcode starting with 75

  century21:
    enabled: false
    filters:
      city: "paris"

  safar:
    enabled: true
    filters:
      paris_zipcodes:  # List of Paris zip codes to search
        - "75001"
        - "75002"
        - "75003"
        - "75004"
        - "75005"
        - "75006"
        - "75008"
        - "75010"
        - "75011"
        - "75012"
        - "75013"
        - "75014"
        - "75015"
        - "75016"
        - "75017"
        - "75018"
        - "75020"
        - "75116"

anti_detection:
  impersonate: "safari17_0"
  min_delay: 5
  max_delay: 15

storage:
  file: "annonces.json"

notifications:
  ntfy_topic: "logements_alerts"
